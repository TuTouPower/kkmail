services:
  outlook-mail-reader:
    build:
      context: .
      dockerfile: Dockerfile
    image: kkmail:local
    container_name: outlook-mail-reader
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      - LOGIN_PASSWORD=admin123
      - SECRET_KEY=change-me-before-public-deploy
      - FLASK_ENV=production
    restart: unless-stopped
