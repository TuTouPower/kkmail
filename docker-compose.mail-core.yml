# Development stack for mail-core: PostgreSQL + API + Worker (+ SPA from image).
# Host disk/volume encryption is REQUIRED in production (see docs/mail-core-architecture.md §11).
# Docker volume ≠ encryption. Sole backend: mail-core.
#
# Required before `docker compose -f docker-compose.mail-core.yml up`:
#   export MAIL_CORE_BLOB_KEY_V1="$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
#   export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
#   export MAIL_CORE_SECRET_KEY="$(openssl rand -hex 32)"
#   export MAIL_CORE_LOGIN_PASSWORD='(set-a-strong-password)'  # or MAIL_CORE_LOGIN_PASSWORD_HASH
#   export MAIL_CORE_BACKUP_KEY="$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
# Backup key MUST differ from the blob key. Do not ship sample all-A keys.
version: "3.9"
# Note: if `docker compose` plugin is unavailable, equivalent for Postgres only:
#   docker run -d --name kkmail-mail-core-pg -e POSTGRES_USER=kkmail \
#     -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" -e POSTGRES_DB=kkmail_mail -p 127.0.0.1:5433:5432 postgres:16
services:
  postgres:
    image: postgres:16
    container_name: kkmail-mail-core-pg
    environment:
      POSTGRES_USER: kkmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kkmail_mail
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kkmail_mail_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkmail -d kkmail_mail"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "mail_core/db/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-api
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
      MAIL_CORE_PUBLIC_BASE: "http://127.0.0.1:8000"
      # Auth: Cookie session signing. Provide MAIL_CORE_LOGIN_PASSWORD_HASH (bcrypt)
      # or MAIL_CORE_LOGIN_PASSWORD — process refuses to start without one.
      MAIL_CORE_SECRET_KEY: ${MAIL_CORE_SECRET_KEY:?set MAIL_CORE_SECRET_KEY (openssl rand -hex 32)}
      MAIL_CORE_LOGIN_PASSWORD_HASH: ${MAIL_CORE_LOGIN_PASSWORD_HASH:-}
      MAIL_CORE_LOGIN_PASSWORD: ${MAIL_CORE_LOGIN_PASSWORD:-}
      # Optional Bearer keys for integrations (comma-separated or JSON list)
      MAIL_CORE_API_KEYS: ${MAIL_CORE_API_KEYS:-}
      # Required: 32-byte AES key, base64-encoded. Generate:
      #   python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())'
      MAIL_CORE_BLOB_KEY_V1: ${MAIL_CORE_BLOB_KEY_V1:?set MAIL_CORE_BLOB_KEY_V1 (base64 32-byte key)}
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BACKUP_KEY: ${MAIL_CORE_BACKUP_KEY:?set MAIL_CORE_BACKUP_KEY (must differ from blob key)}
    ports:
      # Host bind loopback only — do not publish the API on 0.0.0.0.
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 0.0.0.0 inside the container network; host publish is 127.0.0.1 only (above).
    command: ["uvicorn", "mail_core.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-worker
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
      MAIL_CORE_BLOB_KEY_V1: ${MAIL_CORE_BLOB_KEY_V1:?set MAIL_CORE_BLOB_KEY_V1 (base64 32-byte key)}
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BACKUP_KEY: ${MAIL_CORE_BACKUP_KEY:?set MAIL_CORE_BACKUP_KEY (must differ from blob key)}
      MAIL_CORE_WORKER_ID: "compose-worker-1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "mail_core.worker.main"]
    restart: unless-stopped


  imap:
    # L2 IMAP fixture (Dovecot). Port 1143 on host → 143 in container.
    build:
      context: ./tests/mail_core/fixtures/dovecot
    container_name: kkmail-mail-core-imap
    ports:
      - "127.0.0.1:1143:143"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kkmail_mail_core_pg:
