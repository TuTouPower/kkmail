# Development stack for mail-core: PostgreSQL + API + Worker.
# Host disk/volume encryption is REQUIRED in production (see docs/mail-core-architecture.md §11).
# Docker volume ≠ encryption. Flask product shell is NOT started here.
# Cutover: MAIL_CORE_DEFAULT=1 so a co-located SPA/Flask can prefer mail-core
# list/reader (Flask remains login/send fallback — see docs/mail-core-cutover.md).
version: "3.9"
# Note: if `docker compose` plugin is unavailable, equivalent for Postgres only:
#   docker run -d --name kkmail-mail-core-pg -e POSTGRES_USER=kkmail \
#     -e POSTGRES_PASSWORD=kkmail -e POSTGRES_DB=kkmail_mail -p 5433:5432 postgres:16
services:
  postgres:
    image: postgres:16
    container_name: kkmail-mail-core-pg
    environment:
      POSTGRES_USER: kkmail
      POSTGRES_PASSWORD: kkmail
      POSTGRES_DB: kkmail_mail
    ports:
      - "5433:5432"
    volumes:
      - kkmail_mail_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkmail -d kkmail_mail"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:kkmail@postgres:5432/kkmail_mail
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "mail_core/db/alembic.ini", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-api
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:kkmail@postgres:5432/kkmail_mail
      MAIL_CORE_DEFAULT: "1"
      MAIL_CORE_PUBLIC_BASE: "http://127.0.0.1:8000"
      # Dev-only keys — replace in real deployments; backup key MUST differ from blob key.
      MAIL_CORE_BLOB_KEY_V1: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BACKUP_KEY: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB="
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    command: ["uvicorn", "mail_core.api.app:app", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-worker
    environment:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:kkmail@postgres:5432/kkmail_mail
      MAIL_CORE_BLOB_KEY_V1: "AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BACKUP_KEY: "BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB="
      MAIL_CORE_WORKER_ID: "compose-worker-1"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "mail_core.worker.main"]
    restart: unless-stopped


  imap:
    # L2 IMAP fixture (Dovecot). Port 1143 on host → 143 in container.
    build:
      context: ./tests/mail_core/fixtures/dovecot
    container_name: kkmail-mail-core-imap
    ports:
      - "1143:143"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kkmail_mail_core_pg:
