# Development stack for mail-core: PostgreSQL + API + Worker (+ SPA from image).
# Host disk/volume encryption is REQUIRED in production (see docs/blueprint/architecture.md §11).
# Docker volume ≠ encryption. Sole backend: mail-core.
#
# Start the distributed stack (API, migrations, and worker):
#   docker compose -f docker-compose.mail-core.yml --profile distributed up --build -d api worker
# WARNING: a bare `docker compose -f docker-compose.mail-core.yml up -d`
# (no --profile, no service names) is NOT a supported path. api, worker
# and migrate all sit behind the `distributed` profile, so a bare up
# starts only PostgreSQL; and starting api without the profile's migrate
# service leaves it against an unmigrated database (api defaults to
# MAIL_CORE_SKIP_MIGRATIONS=1 and its migrate dependency is not
# required), which shows up as /ready staying 503 / schema-not-at-head
# rather than an up-front error. Always use the profile command above.
# Set these variables before running that command:
#   export MAIL_CORE_BLOB_KEY_V1="$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
#   export POSTGRES_PASSWORD="$(openssl rand -hex 16)"
#   export MAIL_CORE_SECRET_KEY="$(openssl rand -hex 32)"
#   export MAIL_CORE_LOGIN_PASSWORD='(set-a-strong-password)'  # or MAIL_CORE_LOGIN_PASSWORD_HASH
#   export MAIL_CORE_BACKUP_KEY="$(python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())')"
# Backup key MUST differ from the blob key. Do not ship sample all-A keys.
# Note: if `docker compose` plugin is unavailable, equivalent for Postgres only:
#   docker run -d --name kkmail-mail-core-pg -e POSTGRES_USER=kkmail \
#     -e POSTGRES_PASSWORD="$POSTGRES_PASSWORD" -e POSTGRES_DB=kkmail_mail \
#     -p 127.0.0.1:5433:5432 postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
services:
  postgres:
    # Tested tag: postgres:16.15; pinned to its multi-platform index digest.
    # Keep upstream capabilities so its entrypoint can prepare PGDATA and drop to postgres.
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    container_name: kkmail-mail-core-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: kkmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: kkmail_mail
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - kkmail_mail_core_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kkmail -d kkmail_mail"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    profiles: ["distributed"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    environment:
      # POSTGRES_PASSWORD is embedded unescaped in this URL: only [A-Za-z0-9_-] is allowed
      # (the deploy script rejects anything else; a stray @ : / # % would corrupt the URL).
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "-c", "src/mail_core/db/alembic.ini", "upgrade", "head"]
    restart: "no"

  backup:
    profiles: ["maintenance"]
    image: kkmail-mail-core-backup
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: Dockerfile.mail-core-backup
    environment:
      # POSTGRES_PASSWORD is embedded unescaped in this URL: only [A-Za-z0-9_-] is allowed
      # (the deploy script rejects anything else; a stray @ : / # % would corrupt the URL).
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
      MAIL_CORE_BLOB_KEY_V1: ${MAIL_CORE_BLOB_KEY_V1:?set MAIL_CORE_BLOB_KEY_V1 (base64 32-byte key)}
      MAIL_CORE_BACKUP_KEY: ${MAIL_CORE_BACKUP_KEY:?set MAIL_CORE_BACKUP_KEY (must differ from blob key)}
      MAIL_CORE_BLOB_ROOT: "/var/lib/kkmail/blobs"
      MAIL_CORE_BACKUP_DIR: "/backup"
    volumes:
      - kkmail_mail_core_blobs:/var/lib/kkmail/blobs:ro
      - "${MAIL_CORE_DEPLOY_BACKUP_DIR:-./.scratch/deploy_backup}:/backup"
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - -c
      - |
        import json, sys
        from mail_core.backup import run_backup
        try:
            result = run_backup(output_dir="/backup/package")
        except Exception as exc:
            print("sealed_backup_failed:" + type(exc).__name__, file=sys.stderr)
            raise SystemExit(1)
        verify = result.get("verify", {})
        print(json.dumps({"status": result.get("status"), "verified": verify.get("ok"), "members_checked": verify.get("members_checked")}, sort_keys=True))
        if result.get("status") != "ok" or not verify.get("ok"):
            raise SystemExit(1)

  api:
    # Gated like migrate/worker: without the profile a bare `up` would
    # start this api with SKIP_MIGRATIONS=1 and no migrate run (A154).
    profiles: ["distributed"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-api
    restart: unless-stopped
    environment:
      # POSTGRES_PASSWORD is embedded unescaped in this URL: only [A-Za-z0-9_-] is allowed
      # (the deploy script rejects anything else; a stray @ : / # % would corrupt the URL).
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
      MAIL_CORE_PUBLIC_BASE: "http://127.0.0.1:37281"
      # Optional trusted HTTPS origin for provider OAuth callbacks.
      MAIL_CORE_PUBLIC_ORIGIN: "${MAIL_CORE_PUBLIC_ORIGIN:-}"
      # Auth: Cookie session signing. Provide MAIL_CORE_LOGIN_PASSWORD_HASH (bcrypt)
      # or MAIL_CORE_LOGIN_PASSWORD — process refuses to start without one.
      MAIL_CORE_SECRET_KEY: ${MAIL_CORE_SECRET_KEY:?set MAIL_CORE_SECRET_KEY (openssl rand -hex 32)}
      MAIL_CORE_LOGIN_PASSWORD_HASH: ${MAIL_CORE_LOGIN_PASSWORD_HASH:-}
      MAIL_CORE_LOGIN_PASSWORD: ${MAIL_CORE_LOGIN_PASSWORD:-}
      # Optional Bearer keys for integrations (comma-separated or JSON list)
      MAIL_CORE_API_KEYS: ${MAIL_CORE_API_KEYS:-}
      # Secure session cookie by default: browsers only send it over HTTPS,
      # so it cannot leak in clear text — including when MAIL_CORE_HOST_BIND
      # exposes the API on a LAN over plain HTTP. For local HTTP-only
      # debugging on loopback, explicitly set MAIL_CORE_COOKIE_SECURE=0;
      # with 1, login over plain http://127.0.0.1 will not persist a session.
      MAIL_CORE_COOKIE_SECURE: "${MAIL_CORE_COOKIE_SECURE:-1}"
      # Required: 32-byte AES key, base64-encoded. Generate:
      #   python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())'
      MAIL_CORE_BLOB_KEY_V1: ${MAIL_CORE_BLOB_KEY_V1:?set MAIL_CORE_BLOB_KEY_V1 (base64 32-byte key)}
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BLOB_ROOT: "/var/lib/kkmail/blobs"
      MAIL_CORE_BACKUP_KEY: ${MAIL_CORE_BACKUP_KEY:?set MAIL_CORE_BACKUP_KEY (must differ from blob key)}
      MAIL_CORE_WORKER_ID: "compose-worker-1"
      MAIL_CORE_SKIP_MIGRATIONS: "${MAIL_CORE_SKIP_MIGRATIONS:-1}"
      MAIL_CORE_EMBEDDED_WORKER: "${MAIL_CORE_EMBEDDED_WORKER:-0}"
    ports:
      # Defaults to loopback. Set MAIL_CORE_HOST_BIND=0.0.0.0 for LAN hostname access.
      - "${MAIL_CORE_HOST_BIND:-127.0.0.1}:37281:8000"
    volumes:
      - kkmail_mail_core_blobs:/var/lib/kkmail/blobs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ready || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    # Distributed API mode: migrations and worker handled by separate containers.
    # Standalone single-process override: MAIL_CORE_SKIP_MIGRATIONS=0 MAIL_CORE_EMBEDDED_WORKER=1
    command: ["python", "-m", "mail_core", "--host", "0.0.0.0", "--port", "8000"]

  worker:
    profiles: ["distributed"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    build:
      context: .
      dockerfile: Dockerfile.mail-core
    container_name: kkmail-mail-core-worker
    environment:
      # POSTGRES_PASSWORD is embedded unescaped in this URL: only [A-Za-z0-9_-] is allowed
      # (the deploy script rejects anything else; a stray @ : / # % would corrupt the URL).
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail:${POSTGRES_PASSWORD}@postgres:5432/kkmail_mail
      MAIL_CORE_BLOB_KEY_V1: ${MAIL_CORE_BLOB_KEY_V1:?set MAIL_CORE_BLOB_KEY_V1 (base64 32-byte key)}
      MAIL_CORE_BLOB_ACTIVE_VERSION: "1"
      MAIL_CORE_BLOB_ROOT: "/var/lib/kkmail/blobs"
      MAIL_CORE_BACKUP_KEY: ${MAIL_CORE_BACKUP_KEY:?set MAIL_CORE_BACKUP_KEY (must differ from blob key)}
      MAIL_CORE_WORKER_ID: "distributed-worker-1"
    volumes:
      - kkmail_mail_core_blobs:/var/lib/kkmail/blobs
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "mail_core.worker.healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["python", "-m", "mail_core.worker.main"]
    restart: unless-stopped


  imap:
    # L2 IMAP test fixture (Dovecot). Opt-in only — not part of the default stack.
    #   docker compose -f docker-compose.mail-core.yml --profile imap up -d imap
    profiles: ["imap"]
    build:
      context: ./tests/mail_core/fixtures/dovecot
    container_name: kkmail-mail-core-imap
    ports:
      - "127.0.0.1:1143:143"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  kkmail_mail_core_pg:
  kkmail_mail_core_blobs:
