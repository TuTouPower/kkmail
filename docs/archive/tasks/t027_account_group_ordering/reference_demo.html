<!doctype html>
<html lang="zh-CN" data-theme="dark" data-shell="web">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mail Sidebar Demo</title>
<style>
:root {
  color-scheme: dark;
  --app-bg: #171819;
  --sidebar-bg: #1e1f21;
  --list-bg: #202123;
  --reader-bg: #1b1c1e;
  --surface: #252629;
  --surface-hover: #2b2d30;
  --surface-selected: #303236;
  --input-bg: #292a2d;
  --text: #f5f5f7;

  --border-strong: rgba(255,255,255,.12);

  --accent-soft: rgba(10,132,255,.14);

  --danger: #ff453a;

}
html[data-theme="light"] {
  color-scheme: light;
  --app-bg: #f2f2f7;
  --sidebar-bg: #f5f5f7;
  --list-bg: #ffffff;
  --reader-bg: #ffffff;
  --surface: #f0f0f4;
  --surface-hover: #e9e9ee;
  --surface-selected: #e5e5ea;
  --input-bg: #eaeaef;
  --text: #1d1d1f;
  --text-secondary: #6e6e73;
  --text-tertiary: #8e8e93;
  --border: rgba(0,0,0,.075);
  --border-strong: rgba(0,0,0,.12);
  --accent: #007aff;
  --accent-soft: rgba(0,122,255,.10);
  --badge-bg: #e5e5ea;
  --danger: #ff3b30;
  --shadow: 0 22px 60px rgba(0,0,0,.18);
}
* { box-sizing: border-box; }
html, body { margin: 0; width: 100%; height: 100%; }
body {

}
button, input, textarea, select { font: inherit; }
button { color: inherit; }
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible {

}
button { border: 0; cursor: pointer; }
.icon {
  width: 18px;
  height: 18px;

  flex: 0 0 auto;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.icon.small { width: 15px; height: 15px; }
.icon.large { width: 21px; height: 21px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
.app-window {

  height: 100vh;
  min-height: 600px;
  display: flex;
  flex-direction: column;
  background: var(--app-bg);
}
.titlebar {

  border-bottom: 1px solid var(--border);
}
.titlebar-leading { display: flex; align-items: center; gap: 14px; min-width: 0; }
.traffic-lights { display: none; align-items: center; gap: 8px; }
.traffic-light {

}

.traffic-light.yellow { background: #febc2e; }
.traffic-light.green { background: #28c840; }
.titlebar-actions { display: flex; align-items: center; gap: 7px; }
#sidebar-toggle-web { display: none; }
#sidebar-toggle-desktop { display: none; }
.icon-button.sidebar-toggle-collapsed { background: var(--surface-selected); color: var(--text); }
html[data-shell="web"] .titlebar { display: none; }
html[data-shell="web"] #sidebar-toggle-web { display: inline-flex; }
html[data-shell="web"] #sidebar-toggle-desktop { display: none; }
html[data-shell="desktop"] .traffic-lights { display: flex; }
html[data-shell="desktop"] #sidebar-toggle-web { display: none; }
html[data-shell="desktop"] #sidebar-toggle-desktop { display: inline-flex; }
.icon-button {
  width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
  color: var(--text-secondary); background: transparent; border-radius: 8px;

}
.icon-button:hover { background: var(--surface-hover); color: var(--text); }

  min-height: 0;
  min-width: 0;

}

  min-height: 0;

}

}

.sidebar-scroll::-webkit-scrollbar-thumb, .mail-list-scroll::-webkit-scrollbar-thumb, .reader-scroll::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
.sidebar-dynamic { display: flex; flex-direction: column; gap: 10px; }
.sidebar-section { min-width: 0; }
.section-head-row { display: flex; align-items: center; gap: 3px; min-height: 36px; margin: 0 0 2px; }
.section-toggle {
  min-width: 0; flex: 1; height: 36px; display: flex; align-items: center; gap: 8px;
  padding: 0 8px; border: 1px solid transparent; border-radius: 9px; background: transparent; color: var(--text);

.nav-list, .account-master-list { display: flex; flex-direction: column; gap: 2px; }
.nav-item {

  padding: 0 10px 0 calc(8px + var(--tree-indent)); border-radius: var(--row-radius); background: transparent;

}

.nav-item:hover { background: var(--surface-hover); }
.nav-item.active { background: var(--surface-selected); color: var(--accent); }
.nav-item .nav-icon { color: var(--text-secondary); width: 18px; height: 18px; }

.nav-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; font-size: 13px; font-weight: 520; }

}

.groups-list { display: flex; flex-direction: column; gap: 3px; }

.group-block { min-width: 0; border-radius: 10px; }

}
.group-head:hover { background: var(--surface-hover); }
.dragging { opacity: .45; }

}

.disclosure {

}

.group-name {

  background: transparent; border-radius: 7px; text-align: left; font-size: 14px; font-weight: 650; letter-spacing: -.2px;
}

.group-unread { font-size: 11px; font-weight: 650; color: var(--text-secondary); font-variant-numeric: tabular-nums; padding: 0 4px; }
.group-menu-button { width: 25px; height: 26px; opacity: 0; }
.group-head:hover .group-menu-button, .group-menu-button:focus-visible { opacity: 1; }
.group-menu {

}
.menu-item {
  width: 100%; display: flex; align-items: center; gap: 9px; padding: 8px 9px; border-radius: 7px;
  text-align: left; background: transparent; color: var(--text); font-size: 12px;
}
.menu-item:hover { background: var(--surface-hover); }
.menu-item.danger { color: var(--danger); }
.group-children { padding: 1px 0 4px; }
.group-aggregate { display: flex; flex-direction: column; gap: 1px; margin-bottom: 6px; }

}

}

.account-row .account-mail-icon .icon { width: 18px; height: 18px; }

.account-row .count-badge { margin-right: 2px; }
.account-children { display: flex; flex-direction: column; gap: 1px; padding: 1px 0 5px; }

.mobile-backdrop { display: none; }

.sidebar-footer {

  background: var(--sidebar-bg);
}
.settings-trigger {

  border-radius: 9px; background: transparent; color: var(--text-secondary); text-align: left;
}
.settings-trigger:hover, .settings-trigger[aria-expanded="true"] { background: var(--surface-hover); color: var(--text); }

.settings-popover {

}

.popover-title { font-size: 12px; font-weight: 650; margin: 0 0 8px 2px; }

}

.popover-row {

}
.popover-row:hover { background: var(--surface-hover); }
.popover-row .icon { color: var(--text-secondary); }
.mail-list-pane {
  min-width: 0; min-height: 0; display: flex; flex-direction: column;
  background: var(--list-bg); border-right: 1px solid var(--border);
}

.mail-list-title-row { display: flex; align-items: center; gap: 8px; min-width: 0; margin-bottom: 14px; }

html[data-shell="desktop"] .titlebar { display: flex; }
.mail-list-title {
  min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;

}
.mail-list-count { color: var(--text-tertiary); font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums; }
.mail-list-controls { display: flex; align-items: center; gap: 8px; }
.search-box {
  min-width: 0; flex: 1; height: 31px; display: flex; align-items: center; gap: 7px; padding: 0 9px;
  border-radius: 8px; background: var(--input-bg); color: var(--text-tertiary);
}
.search-box .icon { width: 15px; height: 15px; }
.search-box input { width: 100%; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 12px; }
.search-box input::placeholder { color: var(--text-tertiary); }
.compose-button {
  width: 32px; height: 31px; display: inline-flex; align-items: center; justify-content: center;

}
.compose-button:hover { filter: brightness(1.08); }
.mail-list-scroll { flex: 1; min-height: 0; overflow: auto; padding: 7px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.mail-row {

  border: 1px solid transparent; transition: background .12s ease;
}

.mail-row.selected { background: var(--surface-selected); border-color: var(--border); }
.mail-row-top, .mail-row-middle { display: flex; align-items: center; min-width: 0; gap: 7px; }

.mail-row.unread .mail-subject { font-weight: 700; }

.star-button .icon { width: 14px; height: 14px; }
.mail-preview { margin: 5px 0 0 13px; color: var(--text-tertiary); font-size: 11px; line-height: 1.45; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty-state { height: 100%; min-height: 180px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--text-tertiary); text-align: center; padding: 24px; }
.empty-state .icon { width: 29px; height: 29px; opacity: .65; }

.reader-pane { min-width: 0; min-height: 0; display: flex; flex-direction: column; background: var(--reader-bg); }

  padding: 0 22px; border-bottom: 1px solid var(--border);
}

.reader-toolbar .icon-button { width: 31px; height: 31px; }
.reader-scroll { min-height: 0; flex: 1; overflow-y: auto; padding: 30px clamp(22px, 4vw, 52px) 40px; scrollbar-width: thin; scrollbar-color: var(--border-strong) transparent; }
.message-subject { margin: 0 0 24px; font-size: 25px; line-height: 1.28; font-weight: 730; letter-spacing: -.7px; overflow-wrap: anywhere; }
.message-sender-card { display: flex; align-items: center; gap: 11px; margin-bottom: 28px; min-width: 0; }

}

.form-field textarea { min-height: 112px; resize: vertical; line-height: 1.55; }
.form-field input::placeholder, .form-field textarea::placeholder { color: var(--text-tertiary); }
.form-error { color: var(--danger); font-size: 11px; min-height: 0; margin: -6px 0 12px; }
.modal-actions { display: flex; justify-content: flex-end; align-items: center; gap: 8px; padding-top: 8px; }
.button-secondary, .button-primary, .button-danger {
  min-height: 33px; padding: 0 13px; border-radius: 8px; font-size: 12px; font-weight: 620;
}
.button-secondary { background: var(--surface-hover); color: var(--text); }
.button-secondary:hover { filter: brightness(1.04); }
.button-primary { background: var(--accent); color: #fff; }
.button-primary:hover { filter: brightness(1.08); }
.button-danger { background: var(--danger); color: #fff; }
.modal-copy { margin: 0; color: var(--text-secondary); font-size: 12px; line-height: 1.65; }
.manage-list { display: flex; flex-direction: column; gap: 3px; margin-bottom: 13px; }
.manage-account-row { min-width: 0; display: grid; grid-template-columns: minmax(0,1fr) 142px 30px; gap: 8px; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--border); }
.manage-account-email { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 560; }
.manage-account-row select { width: 100%; min-width: 0; border: 1px solid var(--border); border-radius: 7px; padding: 6px 7px; background: var(--input-bg); color: var(--text); font-size: 11px; }
.manage-account-row .icon-button { width: 29px; height: 29px; }
.manager-footer { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-top: 7px; }
.manager-total { color: var(--text-tertiary); font-size: 11px; }
.compose-account-select { margin-bottom: 14px; }
.toast {
  position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 10px); z-index: 200;
  padding: 10px 14px; border-radius: 10px; background: var(--surface); color: var(--text);
  border: 1px solid var(--border-strong); box-shadow: var(--shadow); font-size: 12px; font-weight: 560;
  opacity: 0; pointer-events: none; transition: opacity .18s ease, transform .18s ease;
}
.toast.visible { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 1080px) {
  .app-body { grid-template-columns: 292px 340px minmax(0,1fr); }
  .app-window.sidebar-collapsed .app-body { grid-template-columns: 0 340px minmax(0,1fr); }
  .reader-scroll { padding-left: 25px; padding-right: 25px; }
}
@media (max-width: 860px) {
  .app-body { grid-template-columns: 292px minmax(0,1fr); }
  .app-window.sidebar-collapsed .app-body { grid-template-columns: 0 minmax(0,1fr); }
  .reader-pane { display: none; }
  .mail-list-pane { border-right: 0; }
}
@media (max-width: 600px) {
  .app-body { grid-template-columns: minmax(0,1fr); }
  .sidebar { display: none; }
  .app-window.mobile-sidebar-open .sidebar {

    const from = groups.findIndex(group => group.id === sourceId);
    if (from < 0 || !groups.some(group => group.id === targetId)) return;
    const [moved] = groups.splice(from, 1);
    const targetIndex = groups.findIndex(group => group.id === targetId);
    groups.splice(targetIndex, 0, moved);
    renderAll();
    showToast('分组顺序已更新');
  }
  function restoreDefaultSort() {
    groups.forEach(group => { group.sortMode = 'domain'; });
    masterSortMode = 'domain';
    accounts.forEach(account => { account.order = 0; });
    openMenuGroupId = null;
    settingsPopover.hidden = true;
    settingsTrigger.setAttribute('aria-expanded', 'false');
    renderAll();
    showToast('已按域名和邮箱地址排序');
  }

  function openModal(title, content, wide = false) {
    modalHost.innerHTML = `<div class="modal-backdrop" data-action="backdrop-close">
      <section class="modal ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${escapeHtml(title)}">
        <header class="modal-header"><h2 class="modal-title">${escapeHtml(title)}</h2><button class="icon-button" data-action="close-modal" aria-label="关闭">${icon('close')}</button></header>
        <div class="modal-body">${content}</div>
      </section>
    </div>`;
    modalHost.hidden = false;
    const firstInput = modalHost.querySelector('input:not([type="hidden"]), textarea, select');
    if (firstInput) setTimeout(() => firstInput.focus(), 30);
  }
  function closeModal() {
    modalHost.hidden = true;
    modalHost.innerHTML = '';
  }
  function openNewGroupModal() {
    openModal('新建分组', `<form data-form="create-group">
      <div class="form-field"><label for="group-name-input">分组名称</label><input id="group-name-input" name="name" maxlength="32" placeholder="例如：工作、个人" required></div>
      <div class="form-error" id="modal-error"></div>
      <div class="modal-actions"><button class="button-secondary" type="button" data-action="close-modal">取消</button><button class="button-primary" type="submit">创建分组</button></div>
    </form>`);
  }
  function openRenameGroupModal(groupId) {
    const group = getGroup(groupId);
    if (!group) return;
    openModal('重命名分组', `<form data-form="rename-group" data-group-id="${escapeHtml(groupId)}">
      <div class="form-field"><label for="group-name-input">分组名称</label><input id="group-name-input" name="name" maxlength="32" value="${escapeHtml(group.name)}" required></div>
      <div class="form-error" id="modal-error"></div>
      <div class="modal-actions"><button class="button-secondary" type="button" data-action="close-modal">取消</button><button class="button-primary" type="submit">保存</button></div>
    </form>`);
  }
  function openDeleteGroupModal(groupId) {
    const group = getGroup(groupId);
    if (!group) return;
    const count = accounts.filter(account => account.groupId === groupId).length;
    openModal('删除分组', `<form data-form="delete-group" data-group-id="${escapeHtml(groupId)}">
      <p class="modal-copy">删除“${escapeHtml(group.name)}”分组？${count ? `其中的 ${count} 个邮箱账号仍保留在账号列表中，并退出该分组。` : ''}不会删除邮箱账号或邮件。</p>
      <div class="modal-actions"><button class="button-secondary" type="button" data-action="close-modal">取消</button><button class="button-danger" type="submit">删除分组</button></div>
    </form>`);
  }
  function groupOptions(selectedId) {
    return `<option value="__ungrouped__" ${selectedId == null ? 'selected' : ''}>不加入分组</option>` +
      groups.map(group => `<option value="${escapeHtml(group.id)}" ${selectedId === group.id ? 'selected' : ''}>${escapeHtml(group.name)}</option>`).join('');
  }
  function openAccountManager() {
    const rows = accounts.slice().sort(compareAccounts).map(account => `<div class="manage-account-row">
      <div class="manage-account-email" title="${escapeHtml(account.email)}">${escapeHtml(account.email)}</div>
      <select data-action="assign-account" data-account-id="${escapeHtml(account.id)}" aria-label="移动 ${escapeHtml(account.email)}">${groupOptions(account.groupId)}</select>
      <button class="icon-button" data-action="remove-account" data-account-id="${escapeHtml(account.id)}" title="移除账号" aria-label="移除账号">${icon('trash', 'small')}</button>
    </div>`).join('');
    openModal('账号管理', `<div class="manage-list">${rows || '<p class="modal-copy">还没有添加邮箱账号。</p>'}</div>
      <div class="manager-footer"><span class="manager-total">${accounts.length} 个账号</span><div style="display:flex;gap:8px"><button class="button-secondary" data-action="close-modal" type="button">完成</button><button class="button-primary" data-action="add-account" type="button">添加账号</button></div></div>`, true);
  }
  function openAddAccountModal() {
    openModal('添加邮箱账号', `<form data-form="add-account">
      <div class="form-field"><label for="account-email-input">邮箱地址</label><input id="account-email-input" name="email" type="email" placeholder="name@example.com" autocomplete="off" required></div>
      <div class="form-field"><label for="account-group-input">所属分组</label><select id="account-group-input" name="groupId">${groupOptions(null)}</select></div>
      <div class="form-error" id="modal-error"></div>
      <div class="modal-actions"><button class="button-secondary" type="button" data-action="close-modal">取消</button><button class="button-primary" type="submit">添加账号</button></div>
    </form>`);
  }
  function openRemoveAccountModal(accountId) {
    const account = getAccount(accountId);
    if (!account) return;
    openModal('移除邮箱账号', `<form data-form="remove-account" data-account-id="${escapeHtml(accountId)}">

    </form>`);

  function openComposeModal(prefill = {}) {
    const defaultAccountId = prefill.accountId || (getViewInfo(selectedView).scope === 'account' ? getViewInfo(selectedView).scopeId : accounts[0]?.id);
    const accountOptions = accounts.map(account => `<option value="${escapeHtml(account.id)}" ${account.id === defaultAccountId ? 'selected' : ''}>${escapeHtml(account.email)}</option>`).join('');
    openModal(prefill.title || '新邮件', `<form data-form="compose">
      <div class="form-field"><label for="compose-from">发件账号</label><select id="compose-from" name="accountId" class="compose-account-select">${accountOptions}</select></div>
      <div class="form-field"><label for="compose-to">收件人</label><input id="compose-to" name="to" type="email" value="${escapeHtml(prefill.to || '')}" placeholder="recipient@example.com"></div>
      <div class="form-field"><label for="compose-subject">主题</label><input id="compose-subject" name="subject" value="${escapeHtml(prefill.subject || '')}" placeholder="邮件主题"></div>
      <div class="form-field"><label for="compose-body">正文</label><textarea id="compose-body" name="body" placeholder="写点什么…">${escapeHtml(prefill.body || '')}</textarea></div>
      <div class="modal-actions"><button class="button-secondary" type="button" data-action="close-modal">取消</button><button class="button-secondary" type="button" data-action="save-compose-draft">存为草稿</button><button class="button-primary" type="button" data-action="send-compose">发送</button></div>
    </form>`, true);
  }

  function saveComposedEmail(asDraft) {
    const accountId = modalHost.querySelector('[name="accountId"]')?.value || accounts[0]?.id;
    const account = getAccount(accountId);
    if (!account) { showToast('请先添加邮箱账号'); return; }
    const to = modalHost.querySelector('[name="to"]')?.value.trim() || '';
    const subject = modalHost.querySelector('[name="subject"]')?.value.trim() || '(无主题)';
    const body = modalHost.querySelector('[name="body"]')?.value || '';
    if (!asDraft && !to) {
      const input = modalHost.querySelector('[name="to"]');
      input?.focus();
      input?.setCustomValidity('请填写收件人');
      input?.reportValidity();
      input?.addEventListener('input', () => input.setCustomValidity(''), { once: true });
      return;
    }
    const id = `m-${Date.now()}`;
    emails.unshift({
      id, accountId, folder: asDraft ? 'drafts' : 'sent', sender: asDraft ? '草稿' : '我',
      senderEmail: account.email, recipient: to, subject, preview: body.slice(0, 130) || (asDraft ? '还没有发送的邮件草稿。' : `发送给 ${to}`),
      body, date: '刚刚', unread: false, starred: false
    });
    closeModal();
    selectedView = asDraft ? `account:${accountId}:drafts` : 'all:sent';
    selectedEmailId = id;
    renderAll();
    showToast(asDraft ? '草稿已保存' : '邮件已加入已发送');
  }

  function archiveEmail(emailId) {
    const email = emails.find(item => item.id === emailId);
    if (!email) return;
    email.folder = 'archive';
    renderAll();
    showToast('邮件已归档');
  }
  function trashEmail(emailId) {
    const email = emails.find(item => item.id === emailId);
    if (!email) return;
    email.folder = 'trash';
    renderAll();
    showToast('邮件已移到垃圾箱');
  }
  function toggleRead(emailId) {
    const email = emails.find(item => item.id === emailId);
    if (!email) return;
    email.unread = !email.unread;
    renderAll();
    showToast(email.unread ? '已标记为未读' : '已标记为已读');
  }
  function replyToEmail(emailId) {
    const email = emails.find(item => item.id === emailId);
    if (!email) return;
    const accountId = email.accountId;
    const to = email.sender === '我' ? (email.recipient || '') : email.senderEmail;
    openComposeModal({ accountId, to, subject: `Re: ${email.subject || ''}`, body: '\n\n--- 原邮件 ---\n' + (email.body || '') });
  }

  sidebarDynamic.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const action = button.dataset.action;
    if (action === 'toggle-all') { toggleSection('all'); return; }
    if (action === 'toggle-account-list') { toggleSection('account-list'); return; }
    if (action === 'toggle-group') {
      const group = getGroup(button.dataset.groupId);
      if (group) { group.expanded = !group.expanded; openMenuGroupId = null; renderSidebar(); persist(); }
      return;
    }
    if (action === 'toggle-account') {
      const account = getAccount(button.dataset.accountId);
      if (account) { account.expanded = !account.expanded; renderSidebar(); persist(); }
      return;
    }
    if (action === 'select-view') { selectView(button.dataset.view); return; }
    if (action === 'new-group') { openMenuGroupId = null; openNewGroupModal(); return; }
    if (action === 'sort-default') { restoreDefaultSort(); return; }
    if (action === 'group-menu') {
      openMenuGroupId = openMenuGroupId === button.dataset.groupId ? null : button.dataset.groupId;
      renderSidebar();
      return;
    }
    if (action === 'rename-group') { const id = button.dataset.groupId; openMenuGroupId = null; openRenameGroupModal(id); return; }
    if (action === 'delete-group') { const id = button.dataset.groupId; openMenuGroupId = null; openDeleteGroupModal(id); return; }
  });

  document.addEventListener('click', event => {
    if (!event.target.closest('#settings-popover') && !event.target.closest('#settings-trigger')) {
      settingsPopover.hidden = true;
      settingsTrigger.setAttribute('aria-expanded', 'false');
    }
    if (!event.target.closest('.group-head')) {
      if (openMenuGroupId) { openMenuGroupId = null; renderSidebar(); }
    }
  });

  settingsTrigger.addEventListener('click', () => {
    settingsPopover.hidden = !settingsPopover.hidden;
    settingsTrigger.setAttribute('aria-expanded', String(!settingsPopover.hidden));
  });
  settingsPopover.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    if (button.dataset.action === 'set-theme') {
      theme = button.dataset.themeChoice;
      applyTheme();
      showToast(theme === 'dark' ? '已切换到深色模式' : '已切换到浅色模式');
    } else if (button.dataset.action === 'account-manager') {
      settingsPopover.hidden = true;
      settingsTrigger.setAttribute('aria-expanded', 'false');
      openAccountManager();
    } else if (button.dataset.action === 'sort-default') {
      restoreDefaultSort();
    }
  });

  modalHost.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (button) {
      const action = button.dataset.action;
      if (action === 'close-modal' || action === 'backdrop-close' && event.target.classList.contains('modal-backdrop')) { closeModal(); return; }
      if (action === 'add-account') { openAddAccountModal(); return; }
      if (action === 'remove-account') { openRemoveAccountModal(button.dataset.accountId); return; }
      if (action === 'assign-account') return;
    }
    if (event.target.classList.contains('modal-backdrop')) closeModal();
  });

  modalHost.addEventListener('submit', event => {
    const form = event.target.closest('form[data-form]');
    if (!form) return;
    event.preventDefault();
    const type = form.dataset.form;
    const errorEl = form.querySelector('.form-error');
    if (errorEl) errorEl.textContent = '';
    if (type === 'create-group' || type === 'rename-group') {
      const name = String(new FormData(form).get('name') || '').trim();
      if (!name) { if (errorEl) errorEl.textContent = '请输入分组名称。'; return; }
      const groupId = form.dataset.groupId;
      const duplicate = groups.some(group => group.name.toLocaleLowerCase() === name.toLocaleLowerCase() && group.id !== groupId);
      if (duplicate) { if (errorEl) errorEl.textContent = '已有同名分组，请换一个名称。'; return; }
      if (type === 'create-group') {
        groups.push({ id: `group-${Date.now()}`, name, expanded: true, sortMode: 'domain' });
        showToast('分组已创建');
      } else {
        const group = getGroup(groupId);
        if (group) group.name = name;
        showToast('分组名称已更新');
      }
      closeModal(); openMenuGroupId = null; renderAll(); return;
    }
    if (type === 'delete-group') {
      const groupId = form.dataset.groupId;
      accounts.forEach(account => { if (account.groupId === groupId) account.groupId = null; });
      groups = groups.filter(group => group.id !== groupId);
      if (getViewInfo(selectedView).scope === 'group' && getViewInfo(selectedView).scopeId === groupId) selectedView = 'all:inbox';
      closeModal(); renderAll(); showToast('分组已删除，账号仍保留在账号列表'); return;
    }
    if (type === 'add-account') {
      const formData = new FormData(form);
      const email = String(formData.get('email') || '').trim();
      const groupValue = String(formData.get('groupId') || '__ungrouped__');
      if (!email || !email.includes('@')) { if (errorEl) errorEl.textContent = '请输入有效的邮箱地址。'; return; }
      if (accounts.some(account => account.email.toLowerCase() === email.toLowerCase())) { if (errorEl) errorEl.textContent = '这个邮箱账号已经存在。'; return; }
      const groupId = groupValue === '__ungrouped__' ? null : groupValue;
      accounts.push({ id: `account-${Date.now()}`, email, groupId, expanded: false, order: accounts.length, masterOrder: getMasterAccounts().length });
      if (groupId) { const group = getGroup(groupId); if (group) group.expanded = true; }
      closeModal(); renderAll(); showToast('邮箱账号已添加'); return;
    }
    if (type === 'remove-account') {
      const accountId = form.dataset.accountId;
      accounts = accounts.filter(account => account.id !== accountId);
      emails = emails.filter(email => email.accountId !== accountId);
      if (masterSortMode === 'manual') getMasterAccounts().forEach((account, index) => { account.masterOrder = index; });
      if (getViewInfo(selectedView).scope === 'account' && getViewInfo(selectedView).scopeId === accountId) selectedView = 'all:inbox';
      closeModal(); renderAll(); showToast('邮箱账号已移除'); return;
    }
  });

  modalHost.addEventListener('change', event => {
    const select = event.target.closest('[data-action="assign-account"]');
    if (!select) return;
    const accountId = select.dataset.accountId;
    const targetGroupId = select.value;
    moveAccountToGroup(accountId, targetGroupId, null);
    openAccountManager();
  });

  document.getElementById('mail-list-scroll').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (button && button.dataset.action === 'toggle-star') {
      event.stopPropagation();
      const email = emails.find(item => item.id === button.dataset.emailId);
      if (email) { email.starred = !email.starred; renderMailArea(); persist(); }
      return;
    }
    const row = event.target.closest('[data-action="select-email"]');
    if (row) {
      selectedEmailId = row.dataset.emailId;
      const email = emails.find(item => item.id === selectedEmailId);
      if (email && email.unread) email.unread = false;
      renderAll();
    }
  });
  document.getElementById('mail-list-scroll').addEventListener('keydown', event => {
    if ((event.key === 'Enter' || event.key === ' ') && event.target.matches('[data-action="select-email"]')) {
      event.preventDefault();
      selectedEmailId = event.target.dataset.emailId;
      const email = emails.find(item => item.id === selectedEmailId);
      if (email && email.unread) email.unread = false;
      renderAll();
    }
  });
  document.getElementById('reader-pane').addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button) return;
    const emailId = button.dataset.emailId;
    if (button.dataset.action === 'archive-email') archiveEmail(emailId);
    if (button.dataset.action === 'trash-email') trashEmail(emailId);
    if (button.dataset.action === 'toggle-read') toggleRead(emailId);
    if (button.dataset.action === 'reply') replyToEmail(emailId);
  });
  mailSearch.addEventListener('input', () => renderMailArea());
  document.getElementById('compose-button').addEventListener('click', () => openComposeModal());
  const mobileBackdrop = document.getElementById('mobile-backdrop');
  function updateSidebarToggleState() {
    const narrow = window.matchMedia('(max-width: 600px)').matches;
    const expanded = narrow ? appWindow.classList.contains('mobile-sidebar-open') : !appWindow.classList.contains('sidebar-collapsed');
    [document.getElementById('sidebar-toggle-web'), document.getElementById('sidebar-toggle-desktop')].forEach(button => {
      button.setAttribute('aria-expanded', String(expanded));
      button.setAttribute('aria-label', expanded ? '收起侧边栏' : '展开侧边栏');
      button.title = expanded ? '收起侧边栏' : '展开侧边栏';
      button.classList.toggle('sidebar-toggle-collapsed', !expanded);
    });
  }
  function toggleSidebar() {
    if (window.matchMedia('(max-width: 600px)').matches) {
      const opening = !appWindow.classList.contains('mobile-sidebar-open');
      appWindow.classList.toggle('mobile-sidebar-open', opening);
      mobileBackdrop.hidden = !opening;
    } else {
      appWindow.classList.toggle('sidebar-collapsed');
    }
    updateSidebarToggleState();
  }
  document.getElementById('sidebar-toggle-web').addEventListener('click', toggleSidebar);
  document.getElementById('sidebar-toggle-desktop').addEventListener('click', toggleSidebar);
  window.addEventListener('resize', () => {
    if (!window.matchMedia('(max-width: 600px)').matches) {
      appWindow.classList.remove('mobile-sidebar-open');
      mobileBackdrop.hidden = true;
    }
    updateSidebarToggleState();
  });
  mobileBackdrop.addEventListener('click', () => {
    appWindow.classList.remove('mobile-sidebar-open');
    mobileBackdrop.hidden = true;
  });


  modalHost.addEventListener('click', event => {
    const button = event.target.closest('[data-action="send-compose"], [data-action="save-compose-draft"]');
    if (!button) return;
    saveComposedEmail(button.dataset.action === 'save-compose-draft');
  });

  document.addEventListener('dragstart', event => {
    const accountRow = event.target.closest('.account-row[data-drag-type="account"]');
    const groupHead = event.target.closest('.group-head[data-drag-type="group"]');
    if (!accountRow && !groupHead) return;
    if (event.target.closest('.group-menu-button')) { event.preventDefault(); return; }
    if (accountRow) {
      dragPayload = { type: 'account', id: accountRow.dataset.accountId, context: accountRow.dataset.listContext || 'group' };
    } else {
      dragPayload = { type: 'group', id: groupHead.dataset.groupId };
    }
    try {
      event.dataTransfer.effectAllowed = 'move';
      event.dataTransfer.setData('text/plain', JSON.stringify(dragPayload));
    } catch (_) {}
    requestAnimationFrame(() => (accountRow || groupHead).classList.add('dragging'));
  });

  document.addEventListener('dragover', event => {
    if (!dragPayload) return;
    const groupHead = event.target.closest('.group-head[data-drop-group-id]');
    const emptyZone = event.target.closest('.empty-dropzone[data-drop-group-id]');
    const accountRow = event.target.closest('.account-row[data-target-account-id]');
    const accountListHead = event.target.closest('.section-head-row[data-drop-group-id], .account-master-list[data-drop-group-id]');
    const target = groupHead || emptyZone || accountRow || accountListHead;
    if (!target) return;
    if (dragPayload.type === 'group' && !groupHead) return;
    if (dragPayload.type === 'account' && !(groupHead || emptyZone || accountRow || accountListHead)) return;
    event.preventDefault();
    if (event.dataTransfer) event.dataTransfer.dropEffect = 'move';
    document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
    target.classList.add('drop-target');
  });

  document.addEventListener('drop', event => {
    if (!dragPayload) return;
    const groupHead = event.target.closest('.group-head[data-drop-group-id]');
    const emptyZone = event.target.closest('.empty-dropzone[data-drop-group-id]');
    const accountRow = event.target.closest('.account-row[data-target-account-id]');
    const accountListHead = event.target.closest('.section-head-row[data-drop-group-id], .account-master-list[data-drop-group-id]');
    const target = groupHead || emptyZone || accountRow || accountListHead;
    if (!target) return;
    let payload = dragPayload;
    try {
      const data = event.dataTransfer?.getData('text/plain');
      if (data) payload = JSON.parse(data);
    } catch (_) {}
    if (payload.type === 'group') {
      if (groupHead && groupHead.dataset.dropGroupId !== '__ungrouped__') {
        event.preventDefault();
        reorderGroup(payload.id, groupHead.dataset.dropGroupId);
      }
    } else if (payload.type === 'account') {
      event.preventDefault();
      if (accountListHead) {
        moveAccountToGroup(payload.id, '__ungrouped__', null);
        showToast('账号已从分组移出');
      } else if (accountRow) {
        const targetAccountId = accountRow.dataset.targetAccountId;
        if (targetAccountId && targetAccountId !== payload.id) {
          if (accountRow.dataset.listContext === 'master') {
            const sourceAccount = getAccount(payload.id);
            if (sourceAccount && sourceAccount.groupId != null) {
              moveAccountToGroup(payload.id, '__ungrouped__', null);
              reorderMasterAccount(payload.id, targetAccountId);
              showToast('账号已移至账号列表');
            } else {
              reorderMasterAccount(payload.id, targetAccountId);
            }
          } else {
            const targetAccount = getAccount(targetAccountId);
            if (targetAccount) {
              moveAccountToGroup(payload.id, targetAccount.groupId == null ? '__ungrouped__' : targetAccount.groupId, targetAccountId);
              showToast('分组内账号顺序已更新');
            }
          }
        }
      } else {
        const targetGroupId = target.dataset.dropGroupId;
        if (targetGroupId) {
          moveAccountToGroup(payload.id, targetGroupId, null);
          showToast('账号已移入分组');
        }
      }
    }
    dragPayload = null;
    document.querySelectorAll('.drop-target, .dragging').forEach(el => el.classList.remove('drop-target', 'dragging'));
  });

  document.addEventListener('dragend', () => {
    dragPayload = null;
    document.querySelectorAll('.drop-target, .dragging').forEach(el => el.classList.remove('drop-target', 'dragging'));
  });

  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') {
      if (!modalHost.hidden) closeModal();
      settingsPopover.hidden = true;
      settingsTrigger.setAttribute('aria-expanded', 'false');
      if (openMenuGroupId) { openMenuGroupId = null; renderSidebar(); }
      appWindow.classList.remove('mobile-sidebar-open');
      mobileBackdrop.hidden = true;
    }
  });

  applyTheme();
  updateSidebarToggleState();
  renderAll();
})();
</script>
</body>
</html>
