name: tests

# Template: install as .github/workflows/tests.yml (see docs/ci/README.md).
on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  mail-core:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kkmail_ci
          # Ephemeral per-run container; not a secret, never reused.
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_DB: kkmail_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U kkmail_ci -d kkmail_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      MAIL_CORE_DATABASE_URL: postgresql+psycopg://kkmail_ci:ci-${{ github.run_id }}-${{ github.run_attempt }}@127.0.0.1:5433/kkmail_test
    steps:
      - uses: actions/checkout@v4
      - name: Start IMAP fixture (Dovecot)
        run: |
          docker build -t kkmail-imap-fixture tests/mail_core/fixtures/dovecot
          docker run -d --name imap -p 127.0.0.1:1143:143 kkmail-imap-fixture
          for i in $(seq 1 30); do (echo > /dev/tcp/127.0.0.1/1143) >/dev/null 2>&1 && break; sleep 1; done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-mail-core.txt
            requirements-dev.txt
      # Generates per-run keys, migrates, runs the full suite; DB-backed tests may not skip.
      - run: ./scripts/run-mail-core-tests.sh
        env:
          MAIL_CORE_IMAP_HOST: 127.0.0.1
          MAIL_CORE_IMAP_PORT: "1143"
