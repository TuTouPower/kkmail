<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 保持 45° 角的三个浅蓝色三角形，拉近间距并放大 -->
  <g fill="#4FC3F7">
    <!-- 左上三角形 -->
    <polygon points="21,6 65,6 21,50" />
    
    <!-- 左下三角形 -->
    <polygon points="21,50 65,94 21,94" />
    
    <!-- 右侧大三角形 -->
    <polygon points="79,6 79,94 35,50" />
  </g>
</svg>