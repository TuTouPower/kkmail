[alembic]
script_location = %(here)s/alembic
prepend_sys_path = %(here)s/../../..:src:.
path_separator = os
# sqlalchemy.url comes from MAIL_CORE_DATABASE_URL (required; no built-in credentials).

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
