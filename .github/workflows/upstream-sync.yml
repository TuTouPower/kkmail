name: upstream-sync
on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure remotes
        run: |
          git remote add upstream https://github.com/assast/outlookEmail.git || true
          git fetch upstream main
      - name: Open sync PR if behind
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          behind=$(git rev-list --count HEAD..upstream/main)
          if [ "$behind" = "0" ]; then
            echo "Already up to date"
            exit 0
          fi
          branch="sync/upstream-$(date +%Y%m%d)"
          git checkout -B "$branch"
          git merge upstream/main --no-edit || echo "merge conflicts need review"
          git push -u origin "$branch"
          gh pr create --base main --head "$branch" --title "sync: upstream main" --body "Automated weekly sync from assast/outlookEmail. Review conflicts and API changes before merge." || true
