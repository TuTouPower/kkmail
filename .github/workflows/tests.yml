name: tests
on:
  push:
    paths:
      - "tests/**"
      - "outlook_web/**"
      - "web_outlook_app.py"
      - ".github/workflows/tests.yml"
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt pytest
      - run: pytest tests/test_react_spa_routes.py tests/test_frontend_contract.py -q
