version: '3.8'
services:
  outlook-mail-reader:
    # 上游镜像，不含 kkmail 的 React 界面与修复；要用 kkmail 请改用 docker-compose.react.yml 本地构建。
    image: ghcr.io/assast/outlookemail:latest
    container_name: outlook-mail-reader
    ports:
      - "5000:5000"
    volumes:
      - ./data:/app/data
    environment:
      # 必填：在 .env 或 shell 中设置；不要使用公开示例口令
      - LOGIN_PASSWORD=${LOGIN_PASSWORD:?set LOGIN_PASSWORD}
      - SECRET_KEY=${SECRET_KEY:?set SECRET_KEY (e.g. openssl rand -hex 32)}
      - FLASK_ENV=production
      # 可选：让界面 OAuth 助手使用你自己的 Azure 应用
      # - OAUTH_CLIENT_ID=your-azure-application-client-id
      # - OAUTH_REDIRECT_URI=http://localhost:8080
    restart: unless-stopped
