<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 方形白色背景 -->
  <rect width="100" height="100" fill="#FFFFFF" />
  <!-- 保持 45° 角的三个深天蓝色三角形 (#0284C7，方案 3) -->
  <g fill="#0284C7" transform="translate(50 50) scale(0.72) translate(-50 -50)">
    <!-- 左上三角形 -->
    <polygon points="21,6 65,6 21,50" />
    
    <!-- 左下三角形 -->
    <polygon points="21,50 65,94 21,94" />
    
    <!-- 右侧大三角形 -->
    <polygon points="79,6 79,94 35,50" />
  </g>
</svg>
