# Dedicated test instance. Never use the application Compose or its volumes.
services:
  postgres:
    # Tested tag: postgres:16.15; pinned to its multi-platform index digest.
    image: postgres:16.15@sha256:9e2cf6287f25c3151f4c9421ccce2b17f3e60061c111a29165e0d2cdd9ff0a97
    labels:
      io.kkmail.test_pg: "v1"
    environment:
      POSTGRES_PASSWORD: ${KKMAIL_TEST_PG_PASSWORD:?provide operator-supplied KKMAIL_TEST_PG_PASSWORD (check .env.test on main branch/worktree)}
    ports:
      - "127.0.0.1:${KKMAIL_TEST_PG_PORT:-15433}:5432"
    volumes:
      - test_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 60

  imap:
    image: kkmail-test-dovecot:${KKMAIL_TEST_IMAP_REVISION:-local}
    build:
      context: ../tests/mail_core/fixtures/dovecot
      args:
        FIXTURE_REVISION: ${KKMAIL_TEST_IMAP_REVISION:-local}
    labels:
      io.kkmail.test_imap: "v1"
    ports:
      - "127.0.0.1:${MAIL_CORE_IMAP_PORT:-1143}:143"
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 143 || exit 1"]
      interval: 1s
      timeout: 3s
      retries: 30
volumes:
  test_pg_data:
