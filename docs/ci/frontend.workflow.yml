name: frontend

# Template — copy to .github/workflows/frontend.yml when workflow scope allows.
on:
  push:
    paths:
      - "frontend/**"
      - "docs/ci/frontend.workflow.yml"
  pull_request:
    paths:
      - "frontend/**"
      - "docs/ci/frontend.workflow.yml"

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc -b --pretty false
      - run: npm test
      - run: npm run build
