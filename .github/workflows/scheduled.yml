name: Scheduled Extended Drills & Benchmarks

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended-drills:
    name: Database Migration, Backup Drill & Chaos Recovery
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install uv==0.12.11
          uv venv .venv
          uv pip install --python .venv/bin/python --require-hashes -r requirements-ci.lock

      - name: Start Dedicated Test Services
        run: |
          printf "KKMAIL_TEST_PG_PASSWORD='%s'\n" "$(openssl rand -hex 32)" > .env.test
          chmod 600 .env.test
          scripts/run-mail-core-tests.sh start
          scripts/start-mail-core-imap.sh

      - name: Run Migration Validation
        run: |
          scripts/run-mail-core-tests.sh run -k test_migration_validation

      - name: Run Live Backup & Restore Drill
        run: |
          scripts/run-mail-core-tests.sh run -k test_backup_restore_drill_live
          scripts/mail-core-backup-restore-drill.sh

      - name: Run Multi-Process Worker Chaos Recovery
        run: |
          scripts/run-mail-core-tests.sh run -k test_worker_process_recovery

      - name: Run Mailbox Performance Benchmark
        run: |
          scripts/run-mail-core-tests.sh run -k test_mailbox_performance_baseline

      - name: Upload Extended Artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-drill-artifacts
          path: |
            .scratch/test_runs/
            .scratch/benchmark_report.json
          retention-days: 14
